<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nested overview browser experiment</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      body {
        margin: 0;
        background: #f5f4f0;
        color: #172b36;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header {
        padding: 14px 20px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      button,
      select {
        padding: 7px 12px;
      }
      #map {
        height: 540px;
        width: 900px;
        max-width: 100%;
        margin: 0 20px;
        border: 1px solid #abb7bd;
      }
      #status,
      #summary,
      details {
        margin: 12px 20px;
      }
      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      td,
      th {
        padding: 5px 10px;
        border: 1px solid #c5ced1;
        text-align: right;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      pre {
        white-space: pre-wrap;
        max-height: 600px;
        overflow: auto;
        font-size: 11px;
      }
      .note {
        max-width: 920px;
        margin: 10px 20px;
        color: #51616b;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Nested quantized overview experiment</h1>
      <select id="variant">
        <option value="nested">Nested int32 + delta</option>
        <option value="packed">Matched packed</option></select
      ><button id="show">Show map</button><button id="run">Run browser benchmark</button
      ><button id="download" disabled>Save results</button>
    </header>
    <p class="note">
      91,067 Tokyo buildings. One complete GeoParquet per variant, embedded compact spatial index,
      ordinary source attributes, whole overview geometry. Experimental reader; current Japan demos
      are separate.
    </p>
    <div id="map"></div>
    <div id="status">Initializing MapLibre…</div>
    <div id="summary"></div>
    <details open>
      <summary>Benchmark JSON</summary>
      <pre id="results">No benchmark yet.</pre>
    </details>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
