<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>geoparquet-lod demo</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        background: #fff;
        padding: 8px 10px;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        max-width: 360px;
      }
      #hud code {
        font-size: 12px;
      }
      .maplibregl-popup-content {
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud"></div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('hud').innerHTML =
          'Module scripts do not load from <code>file://</code>. Run <code>npm run demo</code> in <code>js/</code>, which serves this page at <code>http://localhost:8091/demo/</code>.'
      }
    </script>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module">
      import { prefetch, registerProtocol, tileUrl, readRow } from './dist/maplibre.js'
      import { LodReader, httpSource, coalescing } from './dist/index.js'

      const hud = document.getElementById('hud')
      const params = new URLSearchParams(location.search)
      const url = params.get('url')
      if (!url) {
        hud.innerHTML =
          'Pass a file: <code>?url=http://localhost:8083/out.lod.parquet</code><br>' +
          'Put a file next to the repo root, or give any http(s) URL whose server supports range requests.'
        throw new Error('no ?url=')
      }
      const fileUrl = new URL(url, location.href).href

      const reader = await LodReader.open(coalescing(await httpSource([fileUrl])))
      const meta = reader.lod
      const geometries = new Set(Object.values(meta.lods).map((l) => l.geometry_type))
      const bounds = reader.metadata.row_groups.reduce(
        (b, _, g) => {
          const rg = reader.metadata.row_groups[g].columns
          const stat = (leaf) =>
            rg.find((c) => c.meta_data.path_in_schema.join('.') === leaf).meta_data.statistics
          return [
            Math.min(b[0], stat('bbox.xmin').min_value),
            Math.min(b[1], stat('bbox.ymin').min_value),
            Math.max(b[2], stat('bbox.xmax').max_value),
            Math.max(b[3], stat('bbox.ymax').max_value),
          ]
        },
        [180, 90, -180, -90],
      )

      prefetch(fileUrl)
      registerProtocol(maplibregl)
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json',
        bounds,
        fitBoundsOptions: { padding: 20 },
      })

      window.map = map
      const fail = (e) => {
        hud.innerHTML = `<b style="color:#b00">${e?.message ?? e}</b>`
        console.error(e)
      }
      window.addEventListener('unhandledrejection', (e) => fail(e.reason))
      window.addEventListener('error', (e) => fail(e.error ?? e.message))
      map.on('error', (e) => fail(e.error ?? e))
      map.on('load', () => {
        map.addSource('lod', {
          type: 'vector',
          tiles: [tileUrl({ url: fileUrl, layer: 'shapes', pointLayer: 'points' })],
          minzoom: 0,
          maxzoom: 22,
        })
        if (geometries.has('MultiPolygon')) {
          map.addLayer({
            id: 'fill',
            type: 'fill',
            source: 'lod',
            'source-layer': 'shapes',
            paint: {
              'fill-color': '#d0421b',
              'fill-opacity': 0.5,
              'fill-outline-color': '#7a1f08',
            },
          })
        }
        if (geometries.has('MultiLineString')) {
          map.addLayer({
            id: 'line',
            type: 'line',
            source: 'lod',
            'source-layer': 'shapes',
            paint: { 'line-color': '#d0421b', 'line-width': 1.5 },
          })
        }
        // dots stand in for shapes below the shape zoom: about a building's size on screen,
        // never below a pixel, and larger when they carry a cluster count
        map.addLayer({
          id: 'dots',
          type: 'circle',
          source: 'lod',
          'source-layer': 'points',
          paint: {
            'circle-color': '#d0421b',
            'circle-opacity': 0.8,
            'circle-radius': [
              'interpolate',
              ['linear'],
              ['zoom'],
              2,
              ['case', ['has', 'count'], ['min', 20, ['+', 2, ['sqrt', ['get', 'count']]]], 1.5],
              14,
              ['case', ['has', 'count'], ['min', 20, ['+', 2, ['sqrt', ['get', 'count']]]], 3],
            ],
          },
        })

        const show = () => {
          const z = Math.round(map.getZoom())
          const where =
            z > reader.finestZoom ? 'exact primary geometry' : `LOD ${reader.lodForZoom(z).name}`
          // file metadata is untrusted: text nodes only
          hud.replaceChildren(
            Object.assign(document.createElement('b'), { textContent: fileUrl.split('/').pop() }),
            document.createElement('br'),
            document.createTextNode(`zoom ${z} → ${where} of ${Object.keys(meta.lods).join(' ')}`),
            document.createElement('br'),
            document.createTextNode(
              `thinning ${meta.thinning.name ?? ''}; attributes ${meta.attributes.map((a) => a.name).join(', ') || 'none'}`,
            ),
          )
        }
        map.on('zoomend', show)
        show()

        map.on('click', async (e) => {
          const f = map.queryRenderedFeatures(e.point, {
            layers: ['dots', 'fill', 'line'].filter((l) => map.getLayer(l)),
          })[0]
          if (!f) return
          const row = await readRow(fileUrl, f.id, reader.scalarColumns().slice(0, 12))
          const box = document.createElement('div')
          for (const [k, v] of Object.entries({ row: f.id, ...f.properties, ...row })) {
            box.append(document.createTextNode(`${k}: ${v}`), document.createElement('br'))
          }
          new maplibregl.Popup().setLngLat(e.lngLat).setDOMContent(box).addTo(map)
        })
        map.on('mousemove', (e) => {
          const hit = map.queryRenderedFeatures(e.point, {
            layers: ['dots', 'fill', 'line'].filter((l) => map.getLayer(l)),
          }).length
          map.getCanvas().style.cursor = hit ? 'pointer' : ''
        })
      })
    </script>
  </body>
</html>
