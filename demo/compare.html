<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>geoparquet-lod side by side</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #panes {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        height: 100%;
      }
      .pane {
        position: relative;
        border-right: 1px solid #999;
      }
      .map {
        position: absolute;
        inset: 0;
      }
      .hud {
        position: absolute;
        top: 8px;
        left: 8px;
        background: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        max-width: 90%;
        font-variant-numeric: tabular-nums;
      }
      .hud b {
        display: block;
      }
      .hud small {
        display: block;
        color: #666;
      }
      #bar {
        position: absolute;
        bottom: 8px;
        left: 8px;
        background: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        z-index: 2;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
      }
      #bar label:not([hidden]) {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #bar small {
        display: block;
        color: #555;
        margin-top: 4px;
        flex-basis: 100%;
      }
    </style>
  </head>
  <body>
    <div id="panes"></div>
    <div id="bar">
      <label
        >View
        <select id="view">
          <option value="">Custom</option>
          <option value="139.76,35.68,8">Tokyo metro</option>
          <option value="139.76,35.68,11">Tokyo city</option>
          <option value="139.76,35.68,14">Tokyo street</option>
          <option value="135.5,34.69,14">Osaka street</option>
        </select></label
      >
      <label
        >Style
        <select id="style">
          <option value="geometry">Geometry</option>
          <option value="height">Height (carried)</option>
          <option value="subtype">Subtype (source column)</option>
        </select></label
      >
      <label id="latency-control" hidden
        >Data request delay
        <select id="latency">
          <option value="0">Local / 0 ms</option>
          <option value="50">50 ms</option>
          <option value="100">100 ms</option>
        </select></label
      >
      <button id="reload">Fresh load</button>
      <button id="reset">Reset counters (keep caches)</button>
      <span id="zoom"></span>
      <small id="notes"
        >Synchronized views; counts include tile boundary copies, not unique buildings. Different
        thinning and overzoom rules still apply.</small
      >
    </div>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    <script type="module">
      // One pane per file given in the query string, all on the same view, each with a
      // tally of the bytes and requests its reader has made:
      //   ?url=        this layout, read through its page indexes (required)
      //   ?tiledir=    the same file through a tile directory sidecar
      //   ?pmtiles=    a PMTiles archive; ?pmtiles_layer= names its layer (default: buildings)
      //   ?cogp=       a COGP file, read with @cogp/maplibre
      //   ?esri=       a Spatially Optimized Parquet file, read with Esri's MapLibre reference reader
      //   ?center=lon,lat ?zoom=  the starting view
      import { registerProtocol, tileUrl, parseTileUrl, readStats } from './dist/maplibre.js'

      const params = new URLSearchParams(location.search)
      const url = params.get('url')
      if (!url) {
        document.body.innerHTML =
          '<p style="padding:1em">Pass <code>?url=</code> for a file in this layout, and any of ' +
          '<code>tiledir=</code>, <code>pmtiles=</code>, <code>cogp=</code>, <code>esri=</code> for the panes beside it.</p>'
        throw new Error('no ?url=')
      }
      const localServer = params.get('demoServer') === '1'
      const delay = Number(params.get('latency') ?? 50)
      const abs = (u) => {
        if (!u) return null
        const result = new URL(u, location.href)
        if (
          localServer &&
          result.origin === location.origin &&
          result.pathname.startsWith('/data/')
        )
          result.searchParams.set('latency', String(delay))
        return result.href
      }
      const fileUrl = abs(url)
      const dirFile = new URL(fileUrl)
      dirFile.searchParams.set('dir', '1')
      const dirFileUrl = dirFile.href
      const tiledir = abs(params.get('tiledir'))
      const pmtilesUrl = abs(params.get('pmtiles'))
      const pmtilesLayer = params.get('pmtiles_layer') ?? 'buildings'
      const cogpUrl = abs(params.get('cogp'))
      const esriUrl = abs(params.get('esri'))
      const start = {
        center: (params.get('center') ?? '139.76,35.68').split(',').map(Number),
        zoom: Number(params.get('zoom') ?? 12),
      }
      const paint = {
        'fill-color': '#d0421b',
        'fill-opacity': 0.5,
        'fill-outline-color': '#7a1f08',
      }
      let selectedStyle = params.get('style') ?? 'geometry'
      if (!['geometry', 'height', 'subtype'].includes(selectedStyle)) selectedStyle = 'geometry'
      document.getElementById('style').value = selectedStyle
      const properties = () => (selectedStyle === 'geometry' ? [] : [selectedStyle])
      const color = () =>
        selectedStyle === 'height'
          ? [
              'interpolate',
              ['linear'],
              ['to-number', ['get', 'height'], 0],
              0,
              '#d8c9b7',
              10,
              '#f0a24d',
              40,
              '#d0421b',
              150,
              '#55215a',
            ]
          : selectedStyle === 'subtype'
            ? [
                'match',
                ['get', 'subtype'],
                'residential',
                '#d0421b',
                'commercial',
                '#3b75af',
                'industrial',
                '#8960a6',
                'civic',
                '#369b75',
                '#aaa',
              ]
            : '#d0421b'

      // main-thread fetches (PMTiles, Esri) tallied the same way as the workers'
      const mainStats = {}
      const fetched = window.fetch.bind(window)
      window.fetch = async (input, init) => {
        const response = await fetched(input, init)
        const key = String(input instanceof Request ? input.url : input)
        const entry = (mainStats[key] ??= { requests: 0, bytes: 0 })
        entry.requests++
        if (init?.method !== 'HEAD')
          entry.bytes += Number(response.headers.get('content-length') ?? 0)
        return response
      }

      // features in each tile a protocol hands to MapLibre, read from the MVT bytes:
      // a tile is layers (field 3), a layer holds features (field 2)
      const mvtFeatures = (buf) => {
        const b = new Uint8Array(buf)
        let n = 0
        const walk = (start, end, field, visit) => {
          let i = start
          while (i < end) {
            let key = 0
            let shift = 0
            let byte
            do {
              byte = b[i++]
              key |= (byte & 0x7f) << shift
              shift += 7
            } while (byte & 0x80)
            const tag = key >>> 3
            const wire = key & 7
            if (wire === 0) {
              while (b[i++] & 0x80);
            } else if (wire === 1) i += 8
            else if (wire === 5) i += 4
            else if (wire === 2) {
              let len = 0
              shift = 0
              do {
                byte = b[i++]
                len |= (byte & 0x7f) << shift
                shift += 7
              } while (byte & 0x80)
              if (tag === field) visit(i, i + len)
              i += len
            } else return
          }
        }
        walk(0, b.length, 3, (ls, le) => walk(ls, le, 2, () => n++))
        return n
      }
      const tileCounts = {}
      const addProtocol = maplibregl.addProtocol.bind(maplibregl)
      maplibregl.addProtocol = (scheme, handler) =>
        addProtocol(scheme, async (request, abort) => {
          const result = await handler(request, abort)
          if (result?.data instanceof ArrayBuffer || ArrayBuffer.isView(result?.data)) {
            tileCounts[request.url] = (tileCounts[request.url] ?? 0) + mvtFeatures(result.data)
          }
          return result
        })

      registerProtocol(maplibregl)
      const protocol = new pmtiles.Protocol()
      maplibregl.addProtocol('pmtiles', protocol.tile)

      const fill = (source, layer) => ({
        id: `${source}-fill`,
        type: 'fill',
        source,
        'source-layer': layer,
        paint: { ...paint, 'fill-color': color() },
      })
      const dots = (source, layer) => ({
        id: `${source}-dots`,
        type: 'circle',
        source,
        'source-layer': layer,
        paint: {
          'circle-color': color(),
          'circle-opacity': 0.8,
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 1.5, 14, 3],
        },
      })
      const lodSource = (u, options) => ({
        type: 'vector',
        tiles: [
          tileUrl({
            url: u,
            layer: 'shapes',
            pointLayer: 'points',
            properties: properties(),
            ...options,
          }),
        ],
        maxzoom: 22,
      })

      // a query string on the second LOD pane's URL keeps its tally apart from the first
      const panes = [
        {
          title: 'GeoParquet LOD · current reader',
          keys: [fileUrl],
          tile: (u) => u.startsWith('lod://') && parseTileUrl(u).config.url === fileUrl,
          lodUrl: fileUrl,
          sources: { lod: lodSource(fileUrl) },
          layers: [fill('lod', 'shapes'), dots('lod', 'points')],
        },
      ]
      if (tiledir)
        panes.push({
          title: 'LOD columns, tile directory',
          keys: [dirFileUrl, tiledir],
          tile: (u) => u.startsWith('lod://') && parseTileUrl(u).config.url === dirFileUrl,
          lodUrl: dirFileUrl,
          lodOptions: { tiledir },
          sources: { lod: lodSource(dirFileUrl, { tiledir }) },
          layers: [fill('lod', 'shapes'), dots('lod', 'points')],
        })
      if (cogpUrl) {
        const {
          cogpUrl: cogpTiles,
          registerCogpProtocol,
          getCogpStats,
        } = await import('./dist/cogp/index.js')
        registerCogpProtocol(maplibregl)
        panes.push({
          title: 'COGP, @cogp/maplibre',
          keys: [cogpUrl],
          tile: (u) => u.startsWith('cogp://'),
          sources: {
            cogp: {
              type: 'vector',
              tiles: [cogpTiles({ shapes: { url: cogpUrl, properties: {} } })],
              maxzoom: 22,
            },
          },
          layers: [fill('cogp', 'shapes')],
          stats: async () => ({ [cogpUrl]: await getCogpStats(cogpUrl) }),
        })
      }
      if (pmtilesUrl)
        panes.push({
          title: 'PMTiles',
          keys: [pmtilesUrl],
          tile: (u) => u.startsWith('pmtiles://'),
          sources: { shapes: { type: 'vector', url: 'pmtiles://' + pmtilesUrl } },
          layers: [fill('shapes', pmtilesLayer)],
        })
      if (esriUrl) {
        const { MapLibreParquetLayer } = await import('./dist/esri.js')
        const head = await fetch(esriUrl, { method: 'HEAD' })
        const byteSize = Number(head.headers.get('content-length'))
        panes.push({
          title: 'SOP, Esri reference reader',
          keys: [esriUrl],
          sources: {},
          layers: [],
          attach: (map, hud) => {
            // the reader converts each view to GeoJSON on moveend and owns its layers
            const layer = new MapLibreParquetLayer(
              map,
              { parquet: { url: esriUrl }, byteSize },
              {
                onStatusChange: (status) => {
                  hud.dataset.status =
                    status.type === 'ready'
                      ? `level ${status.lod}, ${status.featureCount.toLocaleString()} features${status.featureLimitReached ? ' (limit)' : ''}`
                      : status.type === 'failed'
                        ? status.message
                        : status.type
                  if (status.type === 'ready' && map.getLayer('maplibre-parquet-fill')) {
                    for (const [k, v] of Object.entries(paint))
                      map.setPaintProperty('maplibre-parquet-fill', k, v)
                    for (const id of ['maplibre-parquet-outline', 'maplibre-parquet-line-casing'])
                      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none')
                  }
                },
              },
            )
            layer.initialize()
            map.on('load', () => layer.refresh())
          },
        })
      }

      const container = document.getElementById('panes')
      for (const pane of panes) {
        const div = document.createElement('div')
        div.className = 'pane'
        pane.mapDiv = document.createElement('div')
        pane.mapDiv.className = 'map'
        pane.hud = document.createElement('div')
        pane.hud.className = 'hud'
        div.append(pane.mapDiv, pane.hud)
        container.append(div)
      }
      const maps = []
      for (const pane of panes) {
        const { hud } = pane
        pane.started = performance.now()
        pane.pendingSince = pane.started
        const map = new maplibregl.Map({
          container: pane.mapDiv,
          style:
            params.get('basemap') === '0'
              ? {
                  version: 8,
                  sources: {},
                  layers: [
                    {
                      id: 'background',
                      type: 'background',
                      paint: { 'background-color': '#f3f1ed' },
                    },
                  ],
                }
              : 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json',
          ...start,
          attributionControl: false,
        })
        // on style.load rather than load, so the data panes do not wait for the basemap tiles
        map.once('style.load', () => {
          for (const [id, source] of Object.entries(pane.sources)) map.addSource(id, source)
          for (const layer of pane.layers) map.addLayer(layer)
        })
        pane.attach?.(map, hud)
        map.on('movestart', () => {
          pane.pendingSince = performance.now()
        })
        map.on('idle', () => {
          if (!Object.keys(pane.sources).every((id) => map.getSource(id))) return
          pane.firstIdle ??= performance.now() - pane.started
          if (pane.pendingSince !== undefined) pane.lastIdle = performance.now() - pane.pendingSince
          pane.pendingSince = undefined
        })
        map.on('error', (e) => {
          // MapLibre 5 also emits a plain Error('AbortError') when setTiles
          // interrupts a preceding style update. Cancellation is expected;
          // retain real transport/decoder failures in the HUD.
          if (e.error?.name === 'AbortError' || e.error?.message === 'AbortError') return
          hud.dataset.status = String(e.error?.message ?? e.error ?? e)
          console.error(pane.title, e.error ?? e)
        })
        maps.push({ map, hud, pane })
      }

      window.maps = maps.map((m) => m.map)

      document.getElementById('view').onchange = (event) => {
        if (!event.target.value) return
        const [lon, lat, zoom] = event.target.value.split(',').map(Number)
        maps[0].map.jumpTo({ center: [lon, lat], zoom })
      }
      document.getElementById('style').onchange = (event) => {
        selectedStyle = event.target.value
        for (const { map, pane } of maps) {
          pane.pendingSince = performance.now()
          if (pane.lodUrl) {
            const source = lodSource(pane.lodUrl, pane.lodOptions)
            map.getSource('lod')?.setTiles(source.tiles)
            // Also handle a style choice made before style.load.
            pane.sources.lod = source
          }
          for (const layer of pane.layers) {
            const property = layer.type === 'circle' ? 'circle-color' : 'fill-color'
            layer.paint[property] = color()
            if (map.getLayer(layer.id)) map.setPaintProperty(layer.id, property, color())
          }
        }
      }
      const reload = () => {
        const view = maps[0].map
        params.set('center', [view.getCenter().lng, view.getCenter().lat].join(','))
        params.set('zoom', String(view.getZoom()))
        params.set('style', selectedStyle)
        location.search = params.toString()
      }
      document.getElementById('reload').onclick = reload
      if (localServer) {
        document.getElementById('latency-control').hidden = false
        document.getElementById('latency').value = String(delay)
        document.getElementById('latency').onchange = (event) => {
          params.set('latency', event.target.value)
          reload()
        }
        document.getElementById('notes').textContent +=
          ' Delay applies equally to both data files; no bandwidth cap. Fresh load clears reader caches. Subtype is stored in PMTiles and fetched from source rows in GeoParquet.'
      }

      // keep the views together
      let syncing = false
      for (const { map } of maps) {
        map.on('move', () => {
          if (syncing) return
          syncing = true
          const view = {
            center: map.getCenter(),
            zoom: map.getZoom(),
            bearing: map.getBearing(),
            pitch: map.getPitch(),
          }
          for (const other of maps) if (other.map !== map) other.map.jumpTo(view)
          syncing = false
        })
      }

      let baseline = {}
      let featureBaseline = {}
      const format = (bytes) => (bytes / 1e6).toFixed(2) + ' MB'
      // a file is fetched under several hostnames; match on the object name and query
      const tally = (stats, keys) => {
        let requests = 0
        let bytes = 0
        for (const key of keys) {
          const name = key.slice(key.lastIndexOf('/') + 1)
          for (const [u, entry] of Object.entries(stats)) {
            if (!u.endsWith('/' + name) && u !== key) continue
            const base = baseline[u] ?? { requests: 0, bytes: 0 }
            requests += entry.requests - base.requests
            bytes += entry.bytes - base.bytes
          }
        }
        return { requests, bytes }
      }
      // each pane says which tile URLs are its own
      const features = (pane) => {
        let n = 0
        for (const [u, count] of Object.entries(tileCounts))
          if (pane.tile?.(u)) n += count - (featureBaseline[u] ?? 0)
        return n
      }
      const current = async () => {
        const stats = { ...(await readStats()), ...mainStats }
        for (const { pane } of maps) if (pane.stats) Object.assign(stats, await pane.stats())
        return stats
      }
      const show = async () => {
        const stats = await current()
        for (const { hud, pane } of maps) {
          const { requests, bytes } = tally(stats, pane.keys)
          const children = [
            Object.assign(document.createElement('b'), { textContent: pane.title }),
            document.createTextNode(`${format(bytes)} in ${requests} requests`),
            Object.assign(document.createElement('small'), {
              textContent: hud.dataset.status
                ? hud.dataset.status
                : `${features(pane).toLocaleString()} features delivered (cumulative)`,
            }),
            Object.assign(document.createElement('small'), {
              textContent: `First map idle: ${pane.firstIdle === undefined ? 'loading…' : Math.round(pane.firstIdle) + ' ms'} · Last view/style: ${pane.pendingSince !== undefined ? 'loading…' : Math.round(pane.lastIdle ?? 0) + ' ms'}`,
            }),
          ]
          hud.replaceChildren(...children)
        }
        document.getElementById('zoom').textContent = ` zoom ${maps[0].map.getZoom().toFixed(1)}`
      }
      document.getElementById('reset').onclick = async () => {
        baseline = structuredClone(await current())
        featureBaseline = { ...tileCounts }
        show()
      }
      setInterval(show, 500)
    </script>
  </body>
</html>
