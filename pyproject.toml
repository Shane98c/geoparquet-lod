[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiled-geoparquet"
version = "0.1.0"
description = "Write and validate Tiled GeoParquet files: GeoParquet with per-zoom overview columns and a spatial page index"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["duckdb>=1.5", "pyarrow>=23", "numpy>=2", "shapely>=2.1", "click>=8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
tiled-geoparquet = "tiled_geoparquet.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["python/tiled_geoparquet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
