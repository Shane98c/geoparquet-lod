[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoparquet-lod"
version = "0.1.0"
description = "Write and validate GeoParquet files with per-zoom display payload columns"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["duckdb>=1.3", "pyarrow>=21", "numpy>=2", "shapely>=2.1", "click>=8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
geoparquet-lod = "geoparquet_lod.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["python/geoparquet_lod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
