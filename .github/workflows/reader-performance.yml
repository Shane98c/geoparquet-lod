name: reader performance
on: pull_request
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: js
      - run: uv sync --locked
      - run: node js/test/performance-gate.test.mjs
      - name: Compare base and candidate on one local synthetic fixture
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-reader-performance.sh "$PERFORMANCE_BASE" > reader-performance.json
      - name: Upload comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-performance
          path: reader-performance.json
          if-no-files-found: ignore
